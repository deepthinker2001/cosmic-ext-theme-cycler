name: Release

# Publishing a GitHub release builds the .deb from the release's tag and
# attaches it, with its checksum, to the release.
on:
  release:
    types: [published]
  # To redo a release's packaging by hand, from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    # Compiles every dependency, so it gets no write access: a build script
    # can't reach the token that publishes the release.
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned by commit, not by movable tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }} # the release's own source, also when run by hand
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.93.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cosmic-theme-cycler") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the package version $version." >&2
            exit 1
          fi
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build the .deb
        run: |
          cargo deb --locked -p cosmic-theme-cycler
          cd target/debian
          for deb in cosmic-theme-cycler_*.deb; do sha256sum "$deb" > "$deb.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            target/debian/cosmic-theme-cycler_*.deb
            target/debian/cosmic-theme-cycler_*.deb.sha256
          if-no-files-found: error

  publish:
    # Only downloads the finished .deb and attaches it; runs no build code.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to attach the .deb to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: debs
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd debs
          sha256sum -c ./*.sha256
          gh release upload "$TAG" ./*.deb ./*.sha256 --clobber -R "$GITHUB_REPOSITORY"
